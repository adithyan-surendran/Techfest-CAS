      // Web Audio API Synth
      let audioCtx = null;
      function playBeep(freq = 440, type = 'square', duration = 0.1) {
        try {
          if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state === 'suspended') audioCtx.resume();
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + duration);
        } catch(e) {}
      }

      function ArcadeCabinet() {
        const [muted, setMuted] = useState(true);
        const [score, setScore] = useState(4250);
        const [isJumping, setIsJumping] = useState(false);
        const [showBurst, setShowBurst] = useState(false);
        const [obstaclePos, setObstaclePos] = useState(100);
        const [coinPos, setCoinPos] = useState(80);

        useEffect(() => {
          let reqId;
          let last = performance.now();
          const loop = (now) => {
            const dt = (now - last) / 1000;
            last = now;
            setObstaclePos(p => (p - dt * 45 < -10 ? 110 : p - dt * 45));
            setCoinPos(p => (p - dt * 45 < -10 ? 120 : p - dt * 45));
            reqId = requestAnimationFrame(loop);
          };
          reqId = requestAnimationFrame(loop);
          return () => cancelAnimationFrame(reqId);
        }, []);

        useEffect(() => {
          if (obstaclePos > 20 && obstaclePos < 42 && !isJumping) {
            setIsJumping(true);
            if (!muted) playBeep(300, 'square', 0.15);
            setTimeout(() => setIsJumping(false), 600);
          }
        }, [obstaclePos, isJumping, muted]);

        useEffect(() => {
          if (coinPos > 20 && coinPos < 32 && !showBurst) {
            setShowBurst(true);
            if (!muted) playBeep(988, 'square', 0.2);
            setScore(s => s + 100);
            setTimeout(() => setShowBurst(false), 500);
          }
        }, [coinPos, showBurst, muted]);

        return (
          <div className="w-full flex flex-col items-center my-4">

                  muted ? 'bg-[#121226] text-slate-400' : 'bg-[#39ff14] text-black'

              >

              </button>
            </div>

              <div className="absolute top-0 bottom-0 -right-2 w-2 bg-gradient-to-b from-[#ff007f] to-[#39ff14]"></div>

              <div className="bg-[#181832] border-4 border-black p-3 text-center mb-3">

              </div>

              <div className="bg-[#05050b] border-4 border-black p-3 relative overflow-hidden">
                <div className="scanlines absolute inset-0 opacity-40 pointer-events-none"></div>
                <div className="flex justify-between font-pixel text-[10px] text-[#ffe600] mb-2 border-b border-slate-800 pb-1">
                  <span>SCORE: {String(score).padStart(6, '0')}</span>
                  <span className="text-[#ff007f]">HI-SCORE: 012500</span>
                </div>

                <div className="relative h-44 bg-[#0a0a1a] border-2 border-black overflow-hidden">
                  <div className="absolute bottom-10 w-5 h-5 bg-[#ffe600] border-2 border-black flex items-center justify-center font-pixel text-[9px] text-black" style={{ left: `${coinPos}%` }}>$</div>
                  {showBurst && <div className="absolute bottom-20 left-[25%] font-pixel text-xs text-[#ffe600] glow-yellow">+100</div>}
                  <div className="absolute bottom-3 w-5 h-6 bg-[#ff2a2a] border-2 border-black" style={{ left: `${obstaclePos}%` }}></div>
                  <div className={`absolute left-[20%] bottom-3 transition-transform duration-300 ${isJumping ? '-translate-y-14' : ''}`}>
                    <div className="w-8 h-10 bg-[#ff007f] border-2 border-black flex items-center justify-center font-pixel text-[10px] text-white">🤖</div>

                </div>
              </div>

              <div className="bg-[#101020] border-4 border-black p-2 mt-2 flex items-center justify-between text-[9px] font-pixel">
                <div className="flex items-center gap-2">
                  <div className="w-8 h-5 bg-black border border-slate-700 flex items-center justify-center">

                  </div>
                  <span className="text-[#ffe600]">INSERT COIN 🪙 25¢</span>
                </div>
                <span className="text-slate-500">TF2026</span>

            <div className="mt-3 font-pixel text-xs text-slate-400 uppercase tracking-widest">
              INSERT COIN TO WATCH
            </div>

      }

                      <div className="w-64 bg-[#121226] border-4 border-black p-4 text-left font-mono text-xs"><span className="font-pixel text-[#ffe600] block mb-1">10:00 AM</span><p className="font-bold text-white">Tech Quiz Finals</p><p className="text-slate-400">Auditorium B</p></div>
                      <div className="w-64 bg-[#121226] border-4 border-black p-4 text-left font-mono text-xs"><span className="font-pixel text-[#ffe600] block mb-1">03:00 PM</span><p className="font-bold text-white">Prize Distribution</p><p className="text-slate-400">Main Auditorium</p></div>
                    </>
                  )}
                </div>
              </div>
              <p className="text-[10px] font-pixel text-slate-400 mt-2">◀ USE SLIDE ARROWS TO SCROLL ▶</p>
            </section>

            {/* CONTACT */}
            <section id="contact" className="py-16 px-4 max-w-7xl mx-auto text-center">
              <h2 className="font-pixel text-xl sm:text-3xl text-[#39ff14] uppercase mb-8">💬 CONTACT US</h2>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-6 text-left max-w-2xl mx-auto font-mono text-xs">
                <div className="bg-[#121226] border-4 border-black p-4">
                  <p className="font-pixel text-xs text-[#00f0ff] mb-2">FACULTY COORDINATOR</p>
                  <p className="text-white font-bold">Dr. Alex John</p>
                  <p className="text-slate-300">📞 +91 98765 00001</p>
                  <p className="text-slate-300">✉ techfest@example.com</p>
                </div>
                <div className="bg-[#121226] border-4 border-black p-4">
                  <p className="font-pixel text-xs text-[#ff007f] mb-2">STUDENT COORDINATORS</p>
                  <p className="text-white font-bold">Rahul R. (+91 98765 12345)</p>
                  <p className="text-white font-bold">Ananya P. (+91 98765 67890)</p>
                </div>
              </div>
            </section>

            {/* FOOTER */}
            <footer className="border-t-4 border-black bg-[#05050e] p-6 text-center font-pixel text-xs text-slate-400">
              <p>🏆 TECH FEST 2026 — CODE. INNOVATE. ELEVATE.</p>
              <p className="mt-2 text-[10px] font-mono text-slate-500">© 2026 Tech Fest. All Rights Reserved.</p>
            </footer>

            {/* MODAL */}
            {activeModal && (
              <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
                <div className="bg-[#121226] border-4 border-black p-6 max-w-lg w-full text-left">
                  <h3 className="font-pixel text-lg text-[#00f0ff] mb-2">{activeModal.title}</h3>
                  <p className="font-mono text-xs text-slate-300 mb-4">{activeModal.description}</p>
                  <p className="font-mono text-xs text-[#ffe600] mb-4">Venue: {activeModal.venue} | Prizes: {activeModal.prizes}</p>
                  <div className="flex justify-between items-center">
                    <button onClick={() => setActiveModal(null)} className="font-pixel text-xs text-slate-400">CLOSE</button>
                    <a href={activeModal.registrationUrl} target="_blank" className="pixel-btn bg-[#ff007f] text-white">REGISTER NOW ↗</a>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
